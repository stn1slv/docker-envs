# version: '3.8'

services:

    kafka:
        image: apache/kafka:4.1.1
        container_name: kafka
        restart: always
        ports:
            - "9092:9092"
        volumes:
            - ./kafka/sasl-plain/kafka_server_jaas.conf:/etc/kafka/secrets/kafka_server_jaas.conf:ro
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            
            # --- LISTENERS & SECURITY ---
            # INTERNAL (9094): Plaintext for Docker-to-Docker & Inter-broker
            # CONTROLLER (9093): Plaintext for KRaft
            # EXTERNAL (9092): SASL_PLAINTEXT for You (Host machine)
            KAFKA_LISTENERS: INTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            
            # Map external to SASL, internal to PLAINTEXT
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
            
            # Critical: Broker talks to itself via the unsecured internal port
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            
            # SASL Config
            KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
            KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
            KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf"

            # --- YOUR TUNING PARAMS ---
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_NUM_PARTITIONS: 3

            # ADD THIS LINE TO SILENCE THE HANDSHAKE ERRORS:
            KAFKA_LOG4J_LOGGERS: "kafka.network.SocketServer=ERROR,org.apache.kafka.common.network.Selector=ERROR"